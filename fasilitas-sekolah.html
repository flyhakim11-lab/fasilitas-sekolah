<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistem Pengajuan Fasilitas Sekolah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg:#F4F7FB;
    --panel:#FFFFFF;
    --ink:#0B1220;
    --ink-soft:#5B6472;
    --ink-faint:#9AA3AF;
    --rule:#E4E9F0;
    --rule-strong:#CBD3E0;
    --accent:#2563EB;
    --accent-dark:#1743B0;
    --accent-bright:#3B82F6;
    --accent-bg:#EAF1FF;
    --labkom:#2563EB; --labkom-bg:#EAF1FF; --labkom-line:#BFD5FC;
    --labkim:#0EA95C; --labkim-bg:#E4F9EE; --labkim-line:#A9E6C6;
    --ipad:#F97316; --ipad-bg:#FFF0E1; --ipad-line:#FBCE9E;
    --success:#0EA95C; --success-bg:#E4F9EE;
    --danger:#E11D48; --danger-bg:#FDE7EC;
    --pending:#D97706; --pending-bg:#FEF3DA;
    --cancel:#6B7280; --cancel-bg:#EEF1F5;
    --radius:10px;
    --radius-sm:7px;
    --shadow-card:0 1px 2px rgba(11,18,32,.04), 0 4px 14px rgba(11,18,32,.05);
    --shadow-pop:0 12px 40px rgba(11,18,32,.18);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14.5px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,h4{font-family:'Plus Jakarta Sans','Inter',sans-serif; margin:0; font-weight:700; color:var(--ink); letter-spacing:-.01em;}
  button{font-family:inherit; cursor:pointer;}
  input,select,textarea{font-family:inherit; font-size:14px;}
  a{color:var(--accent);}
  ::selection{background:var(--accent-bg);}

  /* ---------- layout shell ---------- */
  #app{min-height:100vh; display:flex; flex-direction:column;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 22px; background:var(--ink); color:#fff;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-mark{
    width:38px; height:38px; border-radius:10px; background:#fff;
    display:flex; align-items:center; justify-content:center; flex:none;
    padding:5px; box-shadow:0 1px 4px rgba(0,0,0,.15);
  }
  .brand-mark img{width:100%; height:100%; object-fit:contain; display:block;}
  .brand-text h1{font-size:15.5px; letter-spacing:.1px; color:#fff;}
  .brand-text p{margin:0; font-size:11px; color:#A7B4C7;}
  .topbar-right{display:flex; align-items:center; gap:14px;}
  .who{text-align:right; line-height:1.25;}
  .who b{font-size:13px; color:#fff;}
  .who span{display:block; font-size:10.5px; color:#93A3BA; text-transform:uppercase; letter-spacing:.4px;}
  .btn{
    border:1.5px solid var(--rule-strong); background:var(--panel); color:var(--ink);
    padding:9px 15px; border-radius:var(--radius-sm); font-size:13px; font-weight:600;
    display:inline-flex; align-items:center; gap:6px; transition:transform .05s ease, background .15s ease;
  }
  .btn:hover{background:var(--rule);}
  .btn:active{transform:translateY(1px);}
  .btn-accent{background:var(--accent); border-color:var(--accent); color:#fff; box-shadow:0 2px 10px rgba(37,99,235,.28);}
  .btn-accent:hover{background:var(--accent-dark); border-color:var(--accent-dark);}
  .btn-ghost{border-color:var(--rule-strong); color:var(--ink-soft); background:transparent;}
  .btn-ghost:hover{background:var(--rule); color:var(--ink);}
  .btn-danger{border-color:var(--danger); color:var(--danger); background:transparent;}
  .btn-danger:hover{background:var(--danger); color:#fff;}
  .btn-sm{padding:5px 10px; font-size:12px;}
  .btn[disabled]{opacity:.4; cursor:not-allowed; pointer-events:none;}
  .topbar .btn-ghost{border-color:#3A4B66; color:#D7E0EE;}
  .topbar .btn-ghost:hover{background:#1C2941; color:#fff;}

  .shell{display:flex; flex:1; min-height:0;}
  nav.side{
    width:216px; flex:none; background:var(--panel); border-right:1px solid var(--rule);
    padding:16px 10px; display:flex; flex-direction:column; gap:2px;
  }
  nav.side .navgroup-label{font-size:10.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--ink-faint); padding:12px 10px 6px;}
  nav.side button{
    text-align:left; background:none; border:none; color:var(--ink-soft);
    padding:10px 11px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:600;
    display:flex; align-items:center; gap:10px;
  }
  nav.side button:hover{background:var(--accent-bg); color:var(--accent);}
  nav.side button.active{background:var(--accent); color:#fff;}
  nav.side svg{flex:none; opacity:.9;}

  main.content{flex:1; padding:24px 28px; overflow-y:auto;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; margin-bottom:18px; flex-wrap:wrap; gap:10px;}
  .page-head h2{font-size:22px;}
  .page-head p{margin:4px 0 0; color:var(--ink-soft); font-size:13px;}

  .panel{
    background:var(--panel); border:1px solid var(--rule); border-radius:var(--radius);
    padding:18px; margin-bottom:18px; box-shadow:var(--shadow-card);
  }
  .panel-title{font-size:12.5px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft); margin-bottom:12px; font-weight:700;}

  .grid{display:grid; gap:14px;}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  @media (max-width:900px){.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
  @media (max-width:680px){.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}

  .stat-card{border:1px solid var(--rule); border-radius:var(--radius); padding:14px 16px; background:var(--panel); box-shadow:var(--shadow-card);}
  .stat-card .num{font-family:'Plus Jakarta Sans',sans-serif; font-size:28px; font-weight:800;}
  .stat-card .lbl{font-size:12px; color:var(--ink-soft); margin-top:2px;}
  .stat-card.pending{border-left:4px solid var(--pending);}
  .stat-card.approved{border-left:4px solid var(--success);}
  .stat-card.rejected{border-left:4px solid var(--danger);}
  .stat-card.cancelled{border-left:4px solid var(--cancel);}

  table{width:100%; border-collapse:collapse; font-size:13.2px;}
  th{
    text-align:left; padding:9px 10px; font-size:11px; text-transform:uppercase; letter-spacing:.4px;
    color:var(--ink-soft); border-bottom:2px solid var(--ink); white-space:nowrap;
  }
  td{padding:10px; border-bottom:1px solid var(--rule); vertical-align:top;}
  tr:hover td{background:var(--accent-bg);}
  .table-wrap{overflow-x:auto;}
  .empty-row td{color:var(--ink-faint); text-align:center; padding:26px 10px; font-style:italic;}

  .badge{display:inline-block; padding:3px 10px; border-radius:20px; font-size:11px; font-weight:700; letter-spacing:.2px;}
  .badge-pending{background:var(--pending-bg); color:var(--pending);}
  .badge-approved{background:var(--success-bg); color:var(--success);}
  .badge-rejected{background:var(--danger-bg); color:var(--danger);}
  .badge-cancelled{background:var(--cancel-bg); color:var(--cancel);}
  .tag-fac{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:20px;}
  .tag-labkom{background:var(--labkom-bg); color:var(--labkom);}
  .tag-labkim{background:var(--labkim-bg); color:var(--labkim);}
  .tag-ipad{background:var(--ipad-bg); color:var(--ipad);}
  .dot{width:7px; height:7px; border-radius:50%; display:inline-block; background:currentColor;}

  .form-row{margin-bottom:13px;}
  .form-row label{display:block; font-size:12px; font-weight:700; color:var(--ink-soft); margin-bottom:5px; text-transform:uppercase; letter-spacing:.3px;}
  .form-row input, .form-row select, .form-row textarea{
    width:100%; padding:10px 11px; border:1.5px solid var(--rule-strong); border-radius:var(--radius-sm);
    background:#fff; color:var(--ink);
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus{outline:3px solid var(--accent-bg); border-color:var(--accent);}
  .form-row textarea{resize:vertical; min-height:64px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px;}
  @media (max-width:600px){.form-grid{grid-template-columns:1fr;}}
  .hint{font-size:12px; color:var(--ink-faint); margin-top:4px;}
  .error-box{background:var(--danger-bg); color:var(--danger); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; margin-bottom:14px; font-weight:600;}
  .ok-box{background:var(--success-bg); color:var(--success); border-radius:var(--radius-sm); padding:10px 12px; font-size:13px; margin-bottom:14px; font-weight:600;}

  .fac-pick{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:18px;}
  @media (max-width:700px){.fac-pick{grid-template-columns:1fr;}}
  .fac-card{
    border:2px solid var(--rule-strong); border-radius:var(--radius); padding:16px; text-align:left;
    background:#fff; display:flex; flex-direction:column; gap:6px; box-shadow:var(--shadow-card);
  }
  .fac-card b{font-family:'Plus Jakarta Sans',sans-serif; font-size:15px;}
  .fac-card span{font-size:12px; color:var(--ink-soft);}
  .fac-card.labkom{border-color:var(--labkom-line);} .fac-card.labkom:hover{background:var(--labkom-bg);}
  .fac-card.labkim{border-color:var(--labkim-line);} .fac-card.labkim:hover{background:var(--labkim-bg);}
  .fac-card.ipad{border-color:var(--ipad-line);} .fac-card.ipad:hover{background:var(--ipad-bg);}

  .cal-tabs{display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid var(--rule); flex-wrap:wrap;}
  .cal-tab{padding:9px 16px; border:none; background:none; font-weight:700; font-size:13.5px; color:var(--ink-soft); border-bottom:3px solid transparent; margin-bottom:-1px; border-radius:6px 6px 0 0;}
  .cal-tab.active{color:var(--accent); border-bottom-color:var(--accent); background:var(--accent-bg);}
  .cal-grid-wrap{overflow-x:auto;}
  .cal-grid{display:grid; grid-template-columns:100px repeat(4,minmax(140px,1fr)); gap:6px; min-width:640px;}
  .cal-cell{border:1px solid var(--rule); border-radius:var(--radius-sm); padding:7px; min-height:58px; font-size:11.8px; background:#fff;}
  .cal-head{font-weight:700; font-size:11px; text-transform:uppercase; color:var(--ink-soft); text-align:center; padding:6px 0;}
  .cal-day{display:flex; align-items:center; font-weight:700; font-size:12.5px; padding:0 4px;}
  .cal-item{border-radius:6px; padding:4px 7px; margin-bottom:4px; font-size:11.5px; line-height:1.3;}
  .cal-item b{display:block; font-size:11.8px;}
  .cal-item.labkom{background:var(--labkom-bg); color:var(--labkom); border-left:3px solid var(--labkom);}
  .cal-item.labkim{background:var(--labkim-bg); color:var(--labkim); border-left:3px solid var(--labkim);}
  .cal-item.ipad{background:var(--ipad-bg); color:var(--ipad); border-left:3px solid var(--ipad);}
  .cal-item.pend{opacity:.65; border-style:dashed;}
  .cal-empty{color:var(--ink-faint); font-size:11px;}
  .toggle-line{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--ink-soft); margin-bottom:12px;}

  .notif-item{display:flex; gap:10px; padding:13px 12px; border-bottom:1px solid var(--rule);}
  .notif-item.unread{background:var(--accent-bg);}
  .notif-dot{width:8px; height:8px; border-radius:50%; background:var(--accent); margin-top:6px; flex:none;}
  .notif-dot.read{background:transparent;}
  .notif-text b{display:block; font-size:13.3px;}
  .notif-text span{font-size:11.5px; color:var(--ink-faint);}
  .notif-text p{margin:3px 0 0; font-size:12.8px; color:var(--ink-soft);}

  .modal-bg{position:fixed; inset:0; background:rgba(11,18,32,.55); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;}
  .modal{background:#fff; border-radius:var(--radius); padding:22px; width:100%; max-width:460px; max-height:90vh; overflow-y:auto; box-shadow:var(--shadow-pop);}
  .modal h3{font-size:17px; margin-bottom:14px;}
  .modal-actions{display:flex; justify-content:flex-end; gap:8px; margin-top:16px;}

  .login-wrap{flex:1; display:flex; align-items:center; justify-content:center; padding:24px;
    background:
      radial-gradient(circle at 15% 15%, rgba(59,130,246,.16), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(14,169,92,.12), transparent 40%),
      var(--bg);
  }
  .login-card{background:var(--panel); border:1px solid var(--rule); border-radius:16px; padding:36px 32px; width:100%; max-width:390px; box-shadow:var(--shadow-pop);}
  .login-card .brand-mark{margin:0 auto 16px; width:64px; height:64px; padding:8px;}
  .login-card h1{font-size:19px; text-align:center;}
  .login-card p.sub{text-align:center; color:var(--ink-soft); font-size:12.5px; margin:6px 0 22px;}
  .auth-tabs{display:flex; background:var(--bg); border-radius:var(--radius-sm); padding:3px; margin-bottom:20px;}
  .auth-tab{flex:1; text-align:center; padding:8px 0; border:none; background:none; border-radius:6px; font-weight:700; font-size:13px; color:var(--ink-soft);}
  .auth-tab.active{background:#fff; color:var(--accent); box-shadow:var(--shadow-card);}
  .demo-box{background:var(--accent-bg); border-radius:var(--radius-sm); padding:11px 12px; font-size:11.6px; color:var(--accent-dark); margin-top:18px; line-height:1.65;}
  .demo-box code{background:#fff; padding:1px 5px; border-radius:4px;}

  .footnote{font-size:11.5px; color:var(--ink-faint); margin-top:26px; border-top:1px solid var(--rule); padding-top:12px;}
  .assumption{font-size:12px; color:var(--accent-dark); background:var(--accent-bg); border:1px dashed var(--labkom-line); border-radius:var(--radius-sm); padding:9px 11px; margin-top:10px;}
  .icon-btn{border:1px solid var(--rule-strong); background:#fff; border-radius:var(--radius-sm); padding:5px 8px; color:var(--ink-soft);}
  .icon-btn:hover{background:var(--rule);}
  .loading{padding:60px; text-align:center; color:var(--ink-soft);}
  .flex-between{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .muted{color:var(--ink-soft);}
  .comment-box{background:var(--pending-bg); color:#7A4E06; border-radius:var(--radius-sm); padding:8px 10px; font-size:12.3px; margin-top:6px;}

  /* ---------- mobile: bottom tab bar ---------- */
  @media (max-width:680px){
    .shell{flex-direction:column;}
    nav.side{
      width:100%; flex-direction:row; overflow-x:auto; position:fixed; bottom:0; left:0; right:0; z-index:40;
      border-right:none; border-top:1px solid var(--rule); padding:6px 6px calc(6px + env(safe-area-inset-bottom));
      box-shadow:0 -4px 16px rgba(11,18,32,.08); gap:0;
    }
    nav.side button{flex-direction:column; gap:3px; padding:7px 12px; font-size:10px; flex:none; white-space:nowrap; font-weight:600;}
    nav.side button.active{background:var(--accent-bg); color:var(--accent);}
    main.content{padding:18px 16px 84px;}
    .topbar{padding:12px 16px;}
    .who{display:none;}
    .grid-3,.grid-4{grid-template-columns:1fr 1fr;}
    .page-head h2{font-size:19px;}
  }
  @media (max-width:400px){
    .grid-3,.grid-4{grid-template-columns:1fr;}
  }
</style>
</head>

<div id="app"><div class="loading">Memuat sistem...</div></div>

  if(n.error) console.error('load notifications error', n.error);
  DB.users = u.data || [];
  DB.requests = r.data || [];
  DB.notifications = n.data || [];
  if(DB.users.length === 0){ await seed(); }
}
async function saveUsers(){
  if(DB.users.length===0) return;
  const { error } = await sb.from('app_users').upsert(DB.users, { onConflict:'id' });
  if(error) console.error('saveUsers error', error);
}
async function saveRequests(){
  if(DB.requests.length===0) return;
  const { error } = await sb.from('app_requests').upsert(DB.requests, { onConflict:'id' });
  if(error) console.error('saveRequests error', error);
}
async function saveNotifications(){
  if(DB.notifications.length===0) return;
  const { error } = await sb.from('app_notifications').upsert(DB.notifications, { onConflict:'id' });
  if(error) console.error('saveNotifications error', error);
}
async function deleteUserRemote(id){
  const { error } = await sb.from('app_users').delete().eq('id', id);
  if(error) console.error('deleteUser error', error);
}

async function sha256(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function uid(prefix){ return prefix + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function nowIso(){ return new Date().toISOString(); }
function fmtDT(iso){ if(!iso) return '-'; const d = new Date(iso); return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}) + ' ' + d.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}); }

async function seed(){
  const mk = async (username,password,name,role) => ({ id: uid('u'), username, password_hash: await sha256(password), name, role, created_at: nowIso() });
  DB.users = await Promise.all([
    mk('admin','password','Administrator Sistem','admin'),
    mk('pjlabkom','password','PJ Laboratorium Komputer','pj_labkom'),
    mk('pjlabkimia','password','PJ Laboratorium Kimia','pj_labkim'),
    mk('pjipad','password','PJ iPad','pj_ipad'),
    mk('waka','password','Wakil Kepala Sekolah','waka'),
  ]);
  DB.requests = [];
  DB.notifications = [];
  await saveUsers();
}

/* ---------------------------- domain helpers ---------------------------- */
function activeRequestsFor(facility, day, session, excludeId){
  return DB.requests.filter(r => r.facility===facility && r.day===day && r.session===session &&
    (r.status==='Approved' || r.status==='Pending') && r.id !== excludeId);
}
function hasApprovedConflict(facility, day, session, excludeId){
  if(FACILITIES[facility] && FACILITIES[facility].allowMultiple) return false;
  return DB.requests.some(r => r.facility===facility && r.day===day && r.session===session && r.status==='Approved' && r.id!==excludeId);
}
function myRequests(userId){ return DB.requests.filter(r=>r.user_id===userId).sort((a,b)=> b.created_at.localeCompare(a.created_at)); }
function facilityRequests(facility){ return DB.requests.filter(r=>r.facility===facility).sort((a,b)=> b.created_at.localeCompare(a.created_at)); }
function activeCountFor(facility){ return DB.requests.filter(r=>r.facility===facility && (r.status==='Approved'||r.status==='Pending')).length; }
async function resetSchedule(facility, actorLabel){
  const affected = DB.requests.filter(r=>r.facility===facility && (r.status==='Approved'||r.status==='Pending'));
  const ts = nowIso();
  affected.forEach(r=>{
    r.status='Cancelled';
    r.pj_comment = `Jadwal dibersihkan oleh ${actorLabel} untuk periode baru.`;
    r.updated_at=ts;
  });
  if(affected.length>0) await saveRequests();
  return affected.length;
}
function canResetSchedule(facility){
  if(!SESSION) return false;
  if(SESSION.role==='admin') return true;
  if(SESSION.role==='waka') return facility==='ipad';
  if(SESSION.role.startsWith('pj_')) return SESSION.role.replace('pj_','')===facility;
  return false;
}
async function acceptAllPending(facility){
  const pending = DB.requests.filter(r=>r.facility===facility && r.status==='Pending');
  if(pending.length===0) return 0;
  const ts = nowIso();
  pending.forEach(r=>{ r.status='Approved'; r.updated_at=ts; });
  await saveRequests();
  for(const r of pending){
    await addNotification(r.user_id, 'Pengajuan Disetujui', `Pengajuan ${FACILITIES[r.facility].short} Anda pada ${r.day}, ${r.session} telah disetujui.`);
  }
  return pending.length;
}
function userName(id){ const u = DB.users.find(u=>u.id===id); return u? u.name : '—'; }

async function addNotification(userId, title, message){
  DB.notifications.push({ id: uid('n'), user_id:userId, title, message, is_read:false, created_at: nowIso() });
  await saveNotifications();
}
function myNotifications(userId){ return DB.notifications.filter(n=>n.user_id===userId).sort((a,b)=>b.created_at.localeCompare(a.created_at)); }
function unreadCount(userId){ return DB.notifications.filter(n=>n.user_id===userId && !n.is_read).length; }

function attachLoginEvents(){
  document.querySelectorAll('.auth-tab').forEach(b=>b.addEventListener('click', ()=>{
    UI.authMode = b.dataset.mode; UI.loginError=null; UI.regError=null; render();
  }));
  const loginForm = document.getElementById('loginForm');
  if(loginForm) loginForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const u = document.getElementById('loginUsername').value.trim();
    const p = document.getElementById('loginPassword').value;
    const hash = await sha256(p);
    const found = DB.users.find(x=>x.username===u && x.password_hash===hash);
    if(!found){ UI.loginError = 'Username atau kata sandi salah.'; render(); return; }
    SESSION = found; UI = {}; ROUTE = 'dashboard';
    render();
  });
  const regForm = document.getElementById('registerForm');
  if(regForm) regForm.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const name = document.getElementById('regName').value.trim();
    const username = document.getElementById('regUsername').value.trim().toLowerCase().replace(/\s+/g,'.');
    const pass = document.getElementById('regPassword').value;
    const pass2 = document.getElementById('regPassword2').value;
    if(!name || !username){ UI.regError='Nama dan username wajib diisi.'; render(); return; }
    if(pass.length<6){ UI.regError='Kata sandi minimal 6 karakter.'; render(); return; }
    if(pass!==pass2){ UI.regError='Konfirmasi kata sandi tidak cocok.'; render(); return; }
    if(DB.users.some(x=>x.username===username)){ UI.regError='Username sudah digunakan, silakan pilih username lain.'; render(); return; }
    const newUser = { id: uid('u'), username, password_hash: await sha256(pass), name, role:'guru', created_at: nowIso() };
    DB.users.push(newUser);
    await saveUsers();
    SESSION = newUser; UI = {}; ROUTE = 'dashboard';
    render();
  });
}

    const f = FACILITIES[r.facility];

    if(opts.actionsFor==='guru' && (r.status==='Pending'||r.status==='Approved')){
      actions = `<button class="btn btn-ghost btn-sm" data-edit="${r.id}">Ubah</button> <button class="btn btn-danger btn-sm" data-cancel="${r.id}">Batalkan</button>`;
    } else if(opts.actionsFor==='pj' && r.status==='Pending'){
      actions = `<button class="btn btn-accent btn-sm" data-approve="${r.id}">${icon('check')} Setujui</button> <button class="btn btn-danger btn-sm" data-reject="${r.id}">${icon('x')} Tolak</button>`;
    } else if(opts.actionsFor==='pj' && r.status==='Approved'){
      actions = `<button class="btn btn-danger btn-sm" data-pjcancel="${r.id}">${icon('x')} Batalkan</button>`;
    } else if(opts.actionsFor==='pj'){
      actions = `<span class="muted">—</span>`;
    }
    return `<tr>
      <td><span class="tag-fac tag-${r.facility}"><span class="dot"></span>${f.short}</span></td>
      ${opts.showGuru?`<td>${userName(r.user_id)}</td>`:''}
      <td>${r.kelas}</td><td>${r.day}</td><td>${r.session}</td>
      <td>${desc}${r.pj_comment?`<div class="comment-box">Komentar PJ: ${r.pj_comment}</div>`:''}</td>
      <td><span class="badge badge-${r.status.toLowerCase()}">${statusLabel(r.status)}</span></td>
      <td class="muted">${fmtDT(r.created_at)}</td>
      ${opts.actionsFor!=='none' ? `<td>${actions}</td>` : ''}
    </tr>`;
  }).join('')}
  </tbody></table></div>`;
}
function statusLabel(s){ return { Pending:'Menunggu', Approved:'Disetujui', Rejected:'Ditolak', Cancelled:'Dibatalkan' }[s] || s; }

function attachBuatEvents(){
  document.querySelectorAll('[data-pick]').forEach(b=>b.addEventListener('click', ()=>{ UI.selectedFac=b.dataset.pick; UI.formError=null; render(); }));
  const back = document.getElementById('btnBackFac');
  if(back) back.addEventListener('click', ()=>{ UI.selectedFac=null; render(); });
  const form = document.getElementById('reqForm');
  if(form){
    const updateHint = ()=>{
      const day = document.getElementById('f_day').value, sess = document.getElementById('f_session').value;
      if(FACILITIES[UI.selectedFac].allowMultiple){
        document.getElementById('conflictHint').innerHTML = `Fasilitas ini bisa dipakai beberapa kelas sekaligus dalam satu sesi.`;
        return;
      }
      const conflict = hasApprovedConflict(UI.selectedFac, day, sess, null);
      document.getElementById('conflictHint').innerHTML = conflict
        ? `<span style="color:var(--danger); font-weight:600;">Slot ini sudah terisi (Disetujui) — pilih hari/sesi lain.</span>`
        : `Slot tersedia.`;
    };
    document.getElementById('f_day').addEventListener('change', updateHint);
    document.getElementById('f_session').addEventListener('change', updateHint);
    updateHint();
    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const day = document.getElementById('f_day').value, session = document.getElementById('f_session').value;
      const kelas = document.getElementById('f_kelas').value.trim();
      if(hasApprovedConflict(UI.selectedFac, day, session, null)){
        UI.formError = 'Jadwal bentrok: fasilitas ini sudah digunakan (disetujui) pada hari & sesi tersebut. Silakan pilih jadwal lain.';
        render(); return;
      }
      const req = {
        id: uid('r'), facility: UI.selectedFac, user_id: SESSION.id, kelas, day, session,
        status:'Pending', pj_comment:'', created_at: nowIso(), updated_at: nowIso(),
      };
      if(UI.selectedFac==='ipad'){
        req.mapel = document.getElementById('f_mapel').value.trim();
        req.keterangan = document.getElementById('f_keterangan').value.trim();
      } else {
        req.keperluan = document.getElementById('f_keperluan').value.trim();
      }
      DB.requests.push(req);
      await saveRequests();
      const pjUsers = DB.users.filter(u=>u.role===FACILITIES[UI.selectedFac].pjRole);
      for(const pj of pjUsers){ await addNotification(pj.id, 'Pengajuan Baru', `${SESSION.name} mengajukan ${FACILITIES[UI.selectedFac].short} pada ${day}, ${session}.`); }
      UI.selectedFac = null; UI.formError = null; ROUTE='pengajuan_saya';
      render();
    });
  }
}

      const r = DB.requests.find(x=>x.id===UI.pjCancelModalId);

}
function renderCalendarGrid(fac, showPending){
  const statuses = showPending ? ['Approved','Pending'] : ['Approved'];
  return `<div class="cal-grid-wrap"><div class="cal-grid">
    <div></div>${SESSIONS.map(s=>`<div class="cal-head">${s}</div>`).join('')}
    ${DAYS.map(day=>`
      <div class="cal-day">${day}</div>
      ${SESSIONS.map(sess=>{
        const items = DB.requests.filter(r=>r.facility===fac && r.day===day && r.session===sess && statuses.includes(r.status));
        if(items.length===0) return `<div class="cal-cell"><span class="cal-empty">Kosong</span></div>`;
        return `<div class="cal-cell">${items.map(r=>`<div class="cal-item ${fac} ${r.status==='Pending'?'pend':''}"><b>${r.kelas}</b>${r.guru_manual || userName(r.user_id)}${r.status==='Pending'?' · menunggu':''}</div>`).join('')}</div>`;
      }).join('')}
    `).join('')}
  </div></div>`;
}

function hexToRgb(hex){
  const n = parseInt(hex.replace('#',''),16);
  return [(n>>16)&255, (n>>8)&255, n&255];
}
const FACILITY_PDF_COLOR = { labkom:'#2563EB', labkim:'#0EA95C', ipad:'#F97316' };

function exportCalendarPdf(fac){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ orientation:'landscape', unit:'mm', format:'a4' });
    const pageW = doc.internal.pageSize.getWidth();
    const pageH = doc.internal.pageSize.getHeight();
    const f = FACILITIES[fac];
    const [cr,cg,cb] = hexToRgb(FACILITY_PDF_COLOR[fac]);
    const margin = 10;

    /* ---------- header banner ---------- */
    doc.setFillColor(cr,cg,cb);
    doc.rect(0,0,pageW,24,'F');
    doc.setFillColor(11,18,32);
    doc.rect(0,24,pageW,1.2,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(16);
    doc.text(`Jadwal Penggunaan Fasilitas — ${f.label}`, margin, 11);
    doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
    doc.text(`Sistem Pengajuan Fasilitas Sekolah  ·  Diunduh ${new Date().toLocaleString('id-ID',{dateStyle:'long', timeStyle:'short'})}`, margin, 18.5);
    doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
    doc.text('© Hakim Industries', pageW-margin, 11, { align:'right' });

    /* ---------- table geometry ---------- */
    const top = 32;
    const dayColW = 30;
    const tableW = pageW - margin*2;
    const sessColW = (tableW - dayColW) / SESSIONS.length;
    const headerH = 10;
    const minRowH = 16;
    const lineH = 4.6;
    const pad = 2.4;

    doc.setFontSize(8.6);
    // pre-compute rows content & required heights
    const rows = DAYS.map(day=>{
      const cells = SESSIONS.map(sess=>{
        const items = DB.requests.filter(r=>r.facility===fac && r.day===day && r.session===sess && r.status==='Approved');
        const lines = [];
        if(items.length===0){ lines.push({ text:'Kosong', empty:true }); }
        else {
          items.forEach(r=>{
            const who = r.guru_manual || userName(r.user_id);
            const desc = fac==='ipad' ? (r.mapel||'-') : (r.keperluan||'-');
            const wrapped = doc.splitTextToSize(`${r.kelas||'-'} — ${who}`, sessColW - pad*2);
            wrapped.forEach((w,i)=> lines.push({ text:w, bold:i===0 }));
            const wrapped2 = doc.splitTextToSize(desc, sessColW - pad*2);
            wrapped2.forEach(w=> lines.push({ text:w, sub:true }));
          });
        }
        return lines;
      });
      const maxLines = Math.max(...cells.map(c=>c.length));
      const rowH = Math.max(minRowH, pad*2 + maxLines*lineH);
      return { day, cells, rowH };
    });

    function drawHeader(y){
      doc.setFillColor(11,18,32);
      doc.rect(margin, y, dayColW, headerH, 'F');
      doc.setFillColor(cr,cg,cb);
      doc.rect(margin+dayColW, y, tableW-dayColW, headerH, 'F');
      doc.setTextColor(255,255,255); doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.text('Hari', margin+dayColW/2, y+headerH/2+1.3, { align:'center' });
      SESSIONS.forEach((s,i)=>{
        doc.text(s, margin+dayColW+sessColW*i+sessColW/2, y+headerH/2+1.3, { align:'center' });
      });
      return y+headerH;
    }

    let y = drawHeader(top);
    rows.forEach((row, ri)=>{
      if(y + row.rowH > pageH - 16){
        doc.addPage();
        y = drawHeader(margin);
      }
      // day cell
      doc.setFillColor(ri%2===0 ? 234 : 243, ri%2===0 ? 241 : 246, ri%2===0 ? 255 : 250);
      doc.rect(margin, y, dayColW, row.rowH, 'F');
      doc.setDrawColor(203,211,224); doc.setLineWidth(0.15);
      doc.rect(margin, y, dayColW, row.rowH);
      doc.setTextColor(11,18,32); doc.setFont('helvetica','bold'); doc.setFontSize(9.5);
      doc.text(row.day, margin+3, y+row.rowH/2+1.2);

      row.cells.forEach((lines, ci)=>{
        const x = margin+dayColW+sessColW*ci;
        doc.setFillColor(ri%2===0 ? 255 : 250, ri%2===0 ? 255 : 251, ri%2===0 ? 255 : 253);
        doc.rect(x, y, sessColW, row.rowH, 'F');
        doc.setDrawColor(228,233,240); doc.setLineWidth(0.15);
        doc.rect(x, y, sessColW, row.rowH);
        let ty = y+pad+3;
        if(lines.length===1 && lines[0].empty){
          doc.setTextColor(154,163,175); doc.setFont('helvetica','italic'); doc.setFontSize(8.4);
          doc.text(lines[0].text, x+sessColW/2, y+row.rowH/2+1, { align:'center' });
        } else {
          lines.forEach(l=>{
            if(l.bold){ doc.setTextColor(cr,cg,cb); doc.setFont('helvetica','bold'); doc.setFontSize(8.6); }
            else if(l.sub){ doc.setTextColor(91,100,114); doc.setFont('helvetica','normal'); doc.setFontSize(7.8); }
            else { doc.setTextColor(20,26,32); doc.setFont('helvetica','normal'); doc.setFontSize(8.4); }
            doc.text(l.text, x+pad, ty);
            ty += lineH;
          });
        }
      });
      y += row.rowH;
    });

    // outer border
    doc.setDrawColor(11,18,32); doc.setLineWidth(0.4);
    doc.rect(margin, top, tableW, y-top);

    // footer on every page
    const pageCount = doc.internal.getNumberOfPages();
    for(let i=1;i<=pageCount;i++){
      doc.setPage(i);
      doc.setFont('helvetica','normal'); doc.setFontSize(8);
      doc.setTextColor(120,128,140);
      doc.text(`Hanya menampilkan jadwal berstatus Disetujui — Halaman ${i} dari ${pageCount}`, margin, pageH-8);
      doc.text('Sistem Pengajuan Fasilitas Sekolah', pageW-margin, pageH-8, { align:'right' });
    }

    doc.save(`jadwal-${fac}-${Date.now()}.pdf`);
  }catch(e){ alert('Gagal membuat PDF. Coba lagi atau periksa koneksi.'); console.error(e); }
}

function pageProfil(){

    ${UI.pwError ? `<div class="error-box">${UI.pwError}</div>` : ''}
    ${UI.pwOk ? `<div class="ok-box">${UI.pwOk}</div>` : ''}
    <form id="pwForm">
      <div class="form-row"><label>Kata Sandi Saat Ini</label><input type="password" id="pw_current" required></div>
      <div class="form-row"><label>Kata Sandi Baru</label><input type="password" id="pw_new" required minlength="6"></div>
      <button type="submit" class="btn btn-accent">Simpan Kata Sandi</button>
    </form>
  </div>
  <div class="footnote">
    Sistem Pengajuan Fasilitas Sekolah — v1.0. Data pengajuan &amp; pengguna disimpan di database Supabase (PostgreSQL), dapat diakses dari mana saja setelah aplikasi ini di-deploy.<br>
    &copy; ${new Date().getFullYear()} Hakim Industries. Seluruh hak cipta dilindungi.
  </div>`;
}
function attachProfilEvents(){
  const form = document.getElementById('pwForm');
  form.addEventListener('submit', async (e)=>{
    e.preventDefault();
    const current = document.getElementById('pw_current').value;
    const next = document.getElementById('pw_new').value;
    const hash = await sha256(current);
    if(hash !== SESSION.password_hash){ UI.pwError='Kata sandi saat ini salah.'; UI.pwOk=null; render(); return; }
    SESSION.password_hash = await sha256(next);
    const u = DB.users.find(x=>x.id===SESSION.id); u.password_hash = SESSION.password_hash;
    await saveUsers();
    UI.pwError=null; UI.pwOk='Kata sandi berhasil diubah.'; render();
  });
}

    ${DB.users.map(u=>`<tr><td>${u.name}</td><td>${u.username}</td><td>${ROLE_LABEL[u.role]}</td><td class="muted">${fmtDT(u.created_at)}</td>
      <td>${u.id===SESSION.id?'<span class="muted">Akun Anda</span>':`<button class="btn btn-danger btn-sm" data-deluser="${u.id}">Hapus</button>`}</td></tr>`).join('')}
    </tbody></table></div>
  </div>`;
}
function attachUsersEvents(){
  document.getElementById('userForm').addEventListener('submit', async (e)=>{
    e.preventDefault();
    const username = document.getElementById('u_username').value.trim();
    if(DB.users.some(u=>u.username===username)){ UI.userError='Username sudah digunakan.'; UI.userOk=null; render(); return; }
    const pass = document.getElementById('u_password').value;
    DB.users.push({ id: uid('u'), username, password_hash: await sha256(pass), name: document.getElementById('u_name').value.trim(), role: document.getElementById('u_role').value, created_at: nowIso() });
    await saveUsers();
    UI.userError=null; UI.userOk='Pengguna berhasil ditambahkan.'; render();
  });
  document.querySelectorAll('[data-deluser]').forEach(b=>b.addEventListener('click', async ()=>{
    if(!confirm('Hapus pengguna ini?')) return;
    const delId = b.dataset.deluser;
    DB.users = DB.users.filter(u=>u.id!==delId);
    await deleteUserRemote(delId);
    render();
  }));
}
